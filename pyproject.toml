[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpp-risk-analyzer"
version = "1.1.0"
description = "Predicts which files a change in a C++ codebase will ripple into, using the include graph, Git history and machine learning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typer", "rich", "networkx", "scipy", "pandas", "numpy", "scikit-learn", "joblib", "PyMySQL"]
keywords = ["c++", "change impact analysis", "static analysis", "git", "machine learning", "code review"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/yyymaaa/cpp-risk-analyzer"
Source = "https://github.com/yyymaaa/cpp-risk-analyzer"
Issues = "https://github.com/yyymaaa/cpp-risk-analyzer/issues"

[project.scripts]
risk = "cpp_risk_analyzer.cli:app"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["cpp_risk_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that run the full pipeline (deselect with -m 'not slow')"]
