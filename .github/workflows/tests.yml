name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[test]"
      - name: Run tests (unit + end-to-end) and save results
        run: python -m pytest -v --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml

  install:
    # Checks the tool works the way users install it: a normal (non-editable) pip install, run from another folder.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip install (non-editable)
        run: pip install .
      - name: Run from outside the project folder
        working-directory: /tmp
        run: |
          risk --help
          python -c "from core import paths; print('storage:', paths.storage_root())"
