name: release

# Push a version tag to publish a release:
#   git tag v1.1.0 && git push origin v1.1.0
# This runs the tests, builds the package, creates a GitHub Release with the files attached,
# and publishes to PyPI so anyone can run:  pip install cpp-risk-analyzer
on:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test before releasing
        run: |
          pip install -e ".[test]"
          python -m pytest -q
      - name: Check the tag matches the package version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $VERSION in pyproject.toml"; exit 1; }
      - name: Build wheel and source archive
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "${{ github.repository }}"
          --title "cpp-risk-analyzer $GITHUB_REF_NAME"
          --notes "Install: pip install cpp-risk-analyzer==${GITHUB_REF_NAME#v}"

  pypi:
    # Uses PyPI "trusted publishing": no password or token is stored in GitHub.
    # One-time setup on pypi.org is described in the README (Releases section).
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cpp-risk-analyzer/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
