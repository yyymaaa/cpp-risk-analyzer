name: release

# Push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) to publish a GitHub Release
# with an installable wheel. Users can then run:
#   pip install "git+https://github.com/<owner>/cpp-risk-analyzer@v1.0.0"
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test before releasing
        run: |
          pip install -e ".[test]"
          python -m pytest -q
      - name: Build wheel and source archive
        run: |
          pip install build
          python -m build
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "cpp-risk-analyzer $GITHUB_REF_NAME"
          --notes "Install: pip install \"git+https://github.com/${{ github.repository }}@$GITHUB_REF_NAME\""
